<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover es lo que deja que el contenido llegue por debajo
         del notch para poder usar env(safe-area-inset-*) en el CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- El color de la barra del navegador. Sin esto, el móvil pinta una
         franja blanca encima de una app negra. -->
    <meta name="theme-color" content="#0a0b0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Afterplay" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Afterplay</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
