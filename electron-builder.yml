appId: com.afterplay.app
productName: Afterplay
directories:
  buildResources: build
files:
  # Con solo exclusiones, builder incluía todo el repo, incluso worker/.dev.vars.
  # package.json y las dependencias de producción se añaden automáticamente.
  - out/**
  - drizzle/**
  - resources/**
  - '!**/{.env,.env.*,.dev.vars,.dev.vars.*,.npmrc}'
# Ludusavi va como carpeta entera (binario + material legal) a
# resources/ludusavi. extraResources y no asarUnpack a propósito: esto no
# vive en node_modules, es un ejecutable externo que el main lanza desde
# process.resourcesPath sin copiarlo nunca a userData
# (PARTIDAS-GUARDADAS.md §5/§6.3).
extraResources:
  - ludusavi
asarUnpack:
  - resources/**
  # El watcher ejecuta este .exe embebido (ps-list, Fase 1 del barrido de
  # procesos) — un binario no puede ejecutarse desde dentro del asar sin
  # depender de la extracción temporal automática de Electron; desempaquetado
  # queda como fichero real y execFile lo lanza directo.
  - node_modules/ps-list/vendor/**
win:
  executableName: Afterplay
  icon: build/icon.ico
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
# SDL, libSQL y Turso usan binarios Node-API. Sus propios instaladores
# descargan los precompilados; install-app-deps intentaba recompilar SDL
# desde fuentes sin sus devDependencies. postinstall prepara Electron y
# e2e/native-modules.spec.ts comprueba los binarios dentro de ese runtime.
npmRebuild: false
# Auto-actualización vía GitHub Releases (repo público — descargas sin
# token). Publicar: subir version en package.json y `npm run release:win`
# con GH_TOKEN en el entorno; electron-builder sube instalador + latest.yml
# + blockmap a una Release nueva, y el updater de cada instalación (ver
# src/main/updater.ts) la detecta solo.
publish:
  provider: github
  owner: IngeniousFox
  repo: Afterplay
